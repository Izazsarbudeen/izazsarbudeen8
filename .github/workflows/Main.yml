name: Deploy Using Private Repo

on:
  push:
    branches: [main]  # or any branch you want

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout current (public) repo
      uses: actions/checkout@v3

    - name: Clone private repo using PAT
      env:
        TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      run: |
        git clone https://$TOKEN@github.com/izazsarbudeen/izazsarbudeen.github.io.git

    - name: List private repo contents
      run: |
        ls -la izazsarbudeen.github.io

    - name: Deploy or Build
      run: |
        cd izazsarbudeen.github.io
        # run your build or deploy script here
        .github/workflows/jekyll-docker.yml # Or npm run build, or whatever applies
